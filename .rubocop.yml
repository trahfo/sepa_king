inherit_from: .rubocop_todo.yml

plugins:
  - rubocop-performance
  - rubocop-rake
  - rubocop-rspec

AllCops:
  TargetRubyVersion: 3.3
  NewCops: enable
  SuggestExtensions: false
  Exclude:
    - 'gemfiles/vendor/**/*'
    - 'vendor/**/*'
    - 'coverage/**/*'
    - 'pkg/**/*'

Style/Documentation:
  Enabled: false

# The DSL mirrors the ISO 20022 tag names (builder.PmtInf, builder.CdtrAcct …).
Naming/MethodName:
  Exclude:
    - 'lib/sepa_king/message.rb'
    - 'lib/sepa_king/message/*.rb'

Metrics/BlockLength:
  Exclude:
    - 'spec/**/*'
    - '*.gemspec'

# Nested `describe :symbol` groups make described_class a Symbol in the legacy specs.
RSpec/DescribedClass:
  Enabled: false

# '%.2f' % amount is the established style for ISO amounts.
Style/FormatString:
  EnforcedStyle: percent

# "%{value} is invalid" is ActiveModel's error-message interpolation, not Kernel#format.
Style/FormatStringToken:
  Exclude:
    - 'lib/**/*'

# Symbols mirror ISO 20022 names (e.g. :postal_address_24 for PostalAddress24).
Naming/VariableNumber:
  CheckSymbols: false

Metrics/ParameterLists:
  CountKeywordArgs: false

Metrics/ModuleLength:
  Exclude:
    - 'spec/support/**/*'

# Specs live flat in spec/ (spec/address_spec.rb for SEPA::Address).
RSpec/SpecFilePathFormat:
  Enabled: false

RSpec/DescribeClass:
  Exclude:
    - 'spec/golden_spec.rb'
    - 'spec/iso2019_spec.rb'
    - 'spec/validation_spec.rb'
    - 'spec/edge_cases_spec.rb'
    - 'spec/data_model_spec.rb'
